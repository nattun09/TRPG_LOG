name: Update Discord events

on:
  schedule:
    - cron: "*/30 * * * *"   # 30分おき（GitHubの混雑で数分〜数十分遅れることがあります）
  workflow_dispatch:          # Actionsタブから手動実行もできます

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch events from Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          INCLUDE_DESCRIPTION: "1"   # 説明文を公開したくない場合は "0"
        run: python3 scripts/fetch_discord_events.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || (git commit -m "Update Discord events" && git push)
